name: Build slim image to GHCR

# Buduje obraz Vane (wariant slim) z naszej galęzi z poprawkami i publikuje go w GHCR.
# Wyzwalane recznie albo wypchnieciem galezi.

on:
  workflow_dispatch:
  push:
    branches:
      - poprawki-2026-10

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pobranie kodu
        uses: actions/checkout@v4

      - name: Buildx
        uses: docker/setup-buildx-action@v3

      - name: Logowanie do GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Ujednolicenie wersji Next.js (budowa = uruchomienie)
        run: |
          # Dockerfile.slim w fazie uruchomieniowej robi `yarn add playwright`, co przelicza
          # `next` z zakresu ^16.0.7 na najnowszy (dzis 16.4.2), podczas gdy faza budowy
          # uzywa wersji z yarn.lock (16.2.2). Rozjazd konczy sie brakiem preview-props.json.
          # Przygotowujemy lock tak, by obie fazy mialy te sama wersje.
          npm install -g yarn@1.22.22
          yarn add next@16.4.2 --network-timeout 600000
          echo "--- next w yarn.lock ---"
          grep -A2 '^next@' yarn.lock | head -4

      - name: Budowa i publikacja
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/vane-slim"
          echo "Obraz: $IMAGE"
          docker buildx build \
            --platform linux/amd64 \
            -f Dockerfile.slim \
            -t "$IMAGE:poprawki" \
            -t "$IMAGE:poprawki-${GITHUB_SHA::7}" \
            --provenance false \
            --push .
